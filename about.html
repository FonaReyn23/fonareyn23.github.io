            var currentRotation = 0;
            var follower = document.getElementById("followBlock");
            var follower1 = document.getElementById("followBlock1");

            window.addEventListener("mousemove", function(event){
                var cx = event.clientX;
                var cy = event.clientY;

                follower.style.transform = `translate(${cx}px, ${cy}px) rotate(${currentRotation}deg)`;
                follower1.style.transform = `translate(${cx}px, ${cy}px)`
            });

            var card = document.getElementById("cardId");
            card.addEventListener("mouseenter", function(){
                follower.classList.add("hovered");
                follower1.classList.add("hovered1");
            });
            card.addEventListener("mouseleave", function(){
                follower.classList.remove("hovered");
                follower1.classList.remove("hovered1");
            });

            var card1 = document.getElementById("cardId1")
            card1.addEventListener("mouseenter", function(){
                follower.classList.add("hovered");
                follower1.classList.add("hovered1");
                follower.style.borderRadius = "15px"
            });
            card1.addEventListener("mouseleave", function(){
                follower.classList.remove("hovered");
                follower1.classList.remove("hovered1");
                follower.style.borderRadius = "50%"
            });

            var card2 = document.getElementById("cardId2")
            card2.addEventListener("mouseenter", function(){
                follower.classList.add("hovered");
                follower1.classList.add("hovered1");
                follower.style.borderRadius = "15px"
                currentRotation = 45
            });
            card2.addEventListener("mouseleave", function(){
                follower.classList.remove("hovered");
                follower1.classList.remove("hovered1");
                follower.style.borderRadius = "50%"
                currentRotation = 0
            });

            //typedText
            const text = "Мои навыки и хобби";
            const speedTyped = 150;

            function typeWrite(text, speed, index = 0){
                const elementText = document.getElementById("typedText")

                if(index < text.length){
                    elementText.innerHTML += text.charAt(index);
                    setTimeout(() => typeWrite(text, speed, index + 1), speed);
                }
            }
            window.addEventListener("DOMContentLoaded", function(){
                typeWrite(text, speedTyped)
            });
        </script>
