            ::-webkit-scrollbar {
                width: 7px;

            ::-webkit-scrollbar-thumb {
                border: 1px solid rgba(255, 255, 255, 0.08);
                min-height: 100px;
            }
            #followBlock {
                width: 15px;
                height: 15px;
                position: fixed;
                left: 0;
                top: 0;
                z-index: 9999;
                border-radius: 50%;
                background-color: #f5f5f5;
                border: solid 2px #f5f5f5;
                transition: translate(-50%, -50%);
                pointer-events: none;
                transition: 0.1s;
            }
            #followBlock1 {
                width: 25px;
                height: 25px;
                position: fixed;
                left: 0;
                top: 0;
                z-index: 9999;
                border-radius: 50%;
                border: solid 2px #f5f5f5;
                transition: translate(-50%, -50%);
                pointer-events: none;
                transition: 0.15s;
            }
            #followBlock.hovered {
                background-color: rgba(255, 255, 255, 1);
                width: 100px;
                height: 100px;
                transition: translate(-50%, -50%);
                mix-blend-mode: difference;
            }
            #followBlock.hovered11 {
                width: 50px;
                height: 50px;
                mix-blend-mode: difference;
            }
            #followBlock1.hovered1 {
                border: 0;
                width: 0;
                height: 0;
            }
            @media (max-width: 768px){
                #followBlock, #followBlock1{
                    display: none;
                }
            }
        </style>
